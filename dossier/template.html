<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Serif:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
/*
 * Print stylesheet for the commercial dossier.
 *
 * The values mirror the tokens in app/globals.css (primary #3b82f6, the
 * .hero-bg-deep gradients, white cards on a gray-100 border, uppercase
 * tracked eyebrows, rounded-full CTAs). They are restated here, not imported:
 * the site's CSS is Tailwind output and this file is printed on its own.
 * If a token changes there, change it here.
 *
 * Three things the site uses are deliberately ABSENT, because they do not
 * survive PDF viewers: box-shadow and background-clip: text (macOS Preview
 * paints their bounding box solid) and translucent gradient stops (pdf.js
 * tints them). Cards are defined by their border instead, the headline accent
 * is a flat colour, and every gradient stop is opaque. A test locks this.
 */
@page { size: A4; margin: 0; }

:root {
  --primary: #3b82f6;
  --primary-dark: #2563eb;
  --accent: #60a5fa;
  --blue-900: #1e3a8a;
  --blue-700: #1d4ed8;
  --blue-50: #eff6ff;
  --muted: #fafafa;
  --text-secondary: #6e6e73;
  --line: #e5e7eb;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html {
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

body {
  font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
  color: #000;
  background: #fff;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: inherit; text-decoration: none; }
ul { list-style: none; }

/* --- Page frame --------------------------------------------------------- */

.page {
  width: 210mm;
  height: 297mm;
  padding: 15mm 16mm 14mm;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  break-after: page;
  background: #fff;
}
.page:last-child { break-after: auto; }
.page--muted { background: var(--muted); }
.page--dark {
  color: #fff;
  background: #000;
  background-image: radial-gradient(circle at 50% -10%, #0f2040 0%, #000000 58%);
}
.page--blocks {
  color: #fff;
  background: #000;
  background-image: radial-gradient(circle at 50% 50%, #0a172b 0%, #000000 68%);
}

.page-head, .page-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-secondary);
}
.page-head { margin-bottom: 11mm; }
.page-foot { margin-top: auto; padding-top: 6mm; }
.page--dark .page-head, .page--dark .page-foot,
.page--blocks .page-head, .page--blocks .page-foot { color: #9ca3af; }

.brand {
  font-size: 13px;
  font-weight: 900;
  letter-spacing: -0.04em;
  text-transform: uppercase;
  color: #000;
}
.page--dark .brand, .page--blocks .brand { color: #fff; }

/* --- Type --------------------------------------------------------------- */

.eyebrow {
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--blue-700);
  margin-bottom: 4mm;
}
.page--dark .eyebrow, .page--blocks .eyebrow { color: var(--accent); }

h1 {
  font-size: 58px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.04;
}
h2 {
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.08;
}
h3 {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.2;
}
.lead {
  font-size: 13.5px;
  font-weight: 500;
  line-height: 1.6;
  color: #111827;
  max-width: 150mm;
  margin-top: 4mm;
}
.page--dark .lead, .page--blocks .lead { color: #e5e7eb; }
.body {
  font-size: 11px;
  font-weight: 500;
  line-height: 1.55;
  color: #111827;
}
.text-gradient { color: var(--accent); }

/* --- Shared pieces ------------------------------------------------------ */

.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 13px;
  border-radius: 999px;
  background: rgba(59, 130, 246, 0.10);
  border: 1px solid rgba(59, 130, 246, 0.24);
  color: var(--accent);
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }

.card {
  background: #fff;
  color: #000;
  border: 1px solid var(--line);
  border-radius: 26px;
  padding: 7mm;
}

.chip {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--blue-50);
  color: var(--blue-700);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.chip svg { width: 19px; height: 19px; }
.chip--gray { background: #f3f4f6; color: #000; }

.checklist li {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 10.5px;
  font-weight: 600;
  line-height: 1.4;
  color: #000;
}
.checklist li + li { margin-top: 2.2mm; }
.checklist svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; color: var(--blue-700); }

.btn {
  display: inline-block;
  background: var(--blue-900);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 10px 22px;
  border-radius: 999px;
}

/* --- 1. Cover ----------------------------------------------------------- */

.cover-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 8mm;
  padding-bottom: 4mm;
}
.cover-main .lead { margin-top: 0; max-width: 132mm; font-size: 15px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5mm; }
.fact { text-align: center; padding: 8mm 5mm; border-radius: 30px; }
.fact .value { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
.fact .label {
  margin-top: 3mm;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #030712;
}
.markets { margin-top: 9mm; text-align: center; }
.markets .eyebrow { margin-bottom: 3.5mm; }
.markets ul { display: flex; flex-wrap: wrap; justify-content: center; gap: 2.2mm; }
.markets li {
  padding: 5px 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.14);
  font-size: 10px;
  font-weight: 700;
  color: #fff;
}

/* --- 2. Approach -------------------------------------------------------- */

.versus { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; margin-top: 9mm; }
.way { padding: 8mm; border-radius: 28px; }
.way--old { border: 2px dashed #e5e7eb; background: rgba(249, 250, 251, 0.6); }
.way--new {
  border: 2px solid rgba(59, 130, 246, 0.25);
  background: #fff;
}
.way-head { display: flex; align-items: center; gap: 9px; margin-bottom: 6mm; }
.way-head svg { width: 22px; height: 22px; }
.way--old .way-head svg { color: rgba(239, 68, 68, 0.6); }
.way--new .way-head svg { color: var(--primary); }
.way h3 { font-size: 17px; }
.way li {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 11px;
  line-height: 1.45;
}
.way li + li { margin-top: 3.4mm; }
.way li svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px; }
.way--old li { font-weight: 500; color: #111827; }
.way--old li svg { color: #dc2626; }
.way--new li { font-weight: 700; color: #000; }
.way--new li svg { color: var(--primary); }

.section-title { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; margin: 11mm 0 6mm; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5mm; }
.lead + .grid-3 { margin-top: 9mm; }
.problem { border-radius: 30px; display: flex; flex-direction: column; gap: 5mm; }
.problem p { margin-top: 2mm; }

/* --- 3. Local SEO ------------------------------------------------------- */

.pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5mm; margin-top: 8mm; }
.pillar { padding: 6.5mm; }
.pillar-head { display: flex; align-items: center; gap: 10px; margin-bottom: 3mm; }
.pillar .body { margin-bottom: 4mm; color: var(--text-secondary); }

.goal {
  margin-top: 6mm;
  padding: 8mm 9mm;
  border-radius: 32px;
  background: #0a0a0a;
  border: 1px solid rgba(59, 130, 246, 0.5);
}
.goal h3 { color: #93c5fd; font-size: 9px; font-weight: 900; letter-spacing: 0.25em; text-transform: uppercase; }
.goal p { margin-top: 2.5mm; font-size: 11px; font-weight: 500; line-height: 1.55; color: #f3f4f6; }

/* --- 4. Building blocks ------------------------------------------------ */

.badge-offer {
  display: inline-block;
  padding: 6px 18px;
  border-radius: 999px;
  background: var(--blue-700);
  color: #fff;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  margin-bottom: 6mm;
}
.blocks-head { text-align: center; }
.blocks-head .lead { margin-left: auto; margin-right: auto; max-width: 138mm; }
/* Four building blocks: a 2x2 grid keeps them on one page. */
.blocks { display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; margin-top: 9mm; }
.block { border-radius: 32px; padding: 7mm 7mm; }
.block h3 { font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; }
.block .body { margin: 2.5mm 0 4.5mm; }
.footnote { margin-top: 6mm; font-size: 9.5px; font-style: italic; line-height: 1.5; color: #9ca3af; text-align: center; }

/* --- 5. Steps, needs analysis and terms ------------------------------- */

.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6mm; }
.step .number { font-size: 42px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; color: #d1d5db; }
.step .badge {
  margin: 4mm 0 2mm;
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--blue-700);
}
.step .body { margin-top: 2.5mm; }
.terms { display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; }
.term { padding: 6.5mm; }
.term h3 { font-size: 14px; }
.term .body { margin-top: 2.5mm; color: #374151; }

/* --- 6. Contact --------------------------------------------------------- */

.booking {
  margin-top: 9mm;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 9mm;
  align-items: center;
  border-radius: 34px;
  padding: 9mm;
}
.booking h3 { font-size: 22px; }
.booking .body { margin: 3mm 0 6mm; font-size: 12px; }
.booking .url { margin-top: 4mm; font-size: 10px; font-weight: 600; color: var(--blue-700); }
.qr { padding: 4mm; border-radius: 18px; border: 1px solid #e5e7eb; background: #fff; line-height: 0; }
.qr svg { width: 34mm; height: 34mm; display: block; }

.channels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4mm; margin-top: 6mm; }
.channel {
  display: flex;
  flex-direction: column;
  gap: 3mm;
  padding: 6mm;
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
}
.channel .chip { background: rgba(59, 130, 246, 0.14); color: var(--accent); }
.channel .tag {
  font-size: 7.5px;
  font-weight: 900;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #9ca3af;
}
.channel .value { font-size: 11.5px; font-weight: 700; color: #fff; line-height: 1.35; word-break: break-word; }
.closing {
  margin-top: 9mm;
  text-align: center;
  font-family: 'Noto Serif', ui-serif, serif;
  font-style: italic;
  font-weight: 500;
  font-size: 15px;
  line-height: 1.5;
  color: #e5e7eb;
}
.address { margin-top: 4mm; text-align: center; font-size: 9px; font-weight: 500; color: #9ca3af; }
</style>
</head>
<body>
{{pages}}
</body>
</html>
